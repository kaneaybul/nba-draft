name: Validate year-four stock release
on:
  push:
    branches: [codex/year-four-stock]
    paths:
      - script/asset_history/**
      - script/frontend/*asset*.py
      - script/frontend/test_asset_history_visuals.mjs
      - frontend/src/AssetHistory*
      - .github/workflows/endpoint-stock-release.yml
permissions:
  contents: write
concurrency:
  group: year-four-stock-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      VITE_PUBLIC_READ_ONLY: 'true'
      FRONTEND_MAX_STATIC_ASSET_BYTES: '26214400'
      FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/year-four-stock
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - name: Verify endpoint stock and attribution identities
        run: |
          python3 -m unittest discover -s script/asset_history -p 'test_endpoint_stock.py'
          python3 -m unittest discover -s script/asset_history -p 'test_attribution.py'
      - name: Materialize the unchanged source observations
        run: |
          python3 script/asset_history/materialize.py --repo .
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'script/asset_history/backfill')
          from run_player_refresh import unpack
          unpack(Path('processed/asset_history/canonical_runtime_seed.zip'),Path(os.environ['RUNNER_TEMP'])/'endpoint-stock/runtime')
          PY
      - name: Reprice all 30 histories and reconcile endpoint draft outcomes
        run: python3 script/asset_history/endpoint_stock_release.py --repo . --runtime "$RUNNER_TEMP/endpoint-stock/runtime"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify app entry points and league rankings
        run: |
          python3 script/frontend/build_asset_value_data.py --repo .
          cd frontend
          npm ci
          npm run test:asset-value
          npm run test:trade-machine
          npm run test:trade-suggestions
          npm run validate:data
          node ../script/frontend/test_asset_history_visuals.mjs
          npm run build
      - name: Commit the validated data to the reviewed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/data/asset_history/v6 processed/asset_history
          if ! git diff --cached --quiet; then
            git commit -m 'Publish reconciled year-four stock pricing and draft attribution'
            git push origin HEAD:codex/year-four-stock
          fi
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: year-four-stock-validation
          retention-days: 7
          if-no-files-found: ignore
          path: |
            processed/asset_history/endpoint_stock_release.json
            processed/asset_history/attribution_validation.json
            frontend/public/data/asset_history/v6/attribution/manifest.json

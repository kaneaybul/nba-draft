name: Validate young-player calibration
on:
  push:
    branches:
      - codex/young-player-path-production
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: young-player-calibration-release
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VITE_PUBLIC_READ_ONLY: "true"
      FRONTEND_MAX_STATIC_ASSET_BYTES: "26214400"
      FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - run: python3 script/asset_history/materialize.py --repo .
      - name: Verify pricing and publication rules
        run: |
          python3 -m unittest discover -s script/asset_history -p 'test_*.py'
          python3 -m unittest discover -s script/asset_history/backfill -p 'test_*.py'
          python3 script/frontend/test_asset_value_data.py
      - name: Rebuild the complete versioned asset history
        run: python3 script/asset_history/refresh.py --repo . --work-dir "$RUNNER_TEMP/young-path-release"
      - name: Reconcile the method impact
        run: python3 script/asset_history/calibration/release_report.py --repo .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate every live value surface and build
        working-directory: frontend
        run: |
          npm ci
          python3 ../script/frontend/build_asset_value_data.py --repo ..
          npm run test:asset-value
          npm run test:trade-machine
          npm run test:trade-suggestions
          npm run validate:data
          npm run build
      - name: Save the validated release on the implementation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/asset_history/v4 processed/asset_history
          if ! git diff --cached --quiet; then
            git commit -m "Build validated young-player path valuation release"
            git push origin HEAD:codex/young-player-path-production
          fi
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: young-player-calibration-validation
          retention-days: 7
          if-no-files-found: ignore
          path: |
            processed/asset_history/calibration_release.json
            frontend/public/data/asset_history/v4/refresh_status.json
            ${{ runner.temp }}/young-path-release/player_refresh.log
            ${{ runner.temp }}/young-path-release/players/*.log
            ${{ runner.temp }}/young-path-release/players/path_calibration_status.json
            ${{ runner.temp }}/young-path-release/players/path_pricing_coverage.json

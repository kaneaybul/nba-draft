name: Validate direct minutes history
on:
  push:
    branches: [codex/direct-future-minutes]
    paths:
      - .github/workflows/direct-minutes-release.yml
      - script/asset_history/**
permissions:
  contents: write
concurrency:
  group: direct-minutes-release
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VITE_PUBLIC_READ_ONLY: 'true'
      FRONTEND_MAX_STATIC_ASSET_BYTES: '26214400'
      FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: '8388608'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - name: Test valuation and backfill
        run: |
          python3 -m unittest discover -s script/asset_history -p 'test_*.py'
          python3 -m unittest discover -s script/asset_history/backfill -p 'test_*.py'
      - name: Replay the latest validated observation
        run: |
          python3 -c 'import json; print("Replaying", json.load(open("processed/asset_history/player_state/UTA.json"))["as_of"])'
          python3 script/asset_history/refresh.py --repo . --work-dir "$RUNNER_TEMP/direct-minutes" --reseed --allow-reconstructed --use-published-inputs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate attribution and build the explorer
        run: |
          python3 script/asset_history/validate_attribution.py --repo .
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('frontend/public/data/asset_history')
          for old in sorted((root/'v9/teams').glob('*.json')):
              before = json.loads(old.read_text())['snapshots']
              after = json.loads((root/'v10/teams'/old.name).read_text())['snapshots']
              assert [s['date'] for s in before] == [s['date'] for s in after], old.name
              for a,b in zip(before,after):
                  picks = lambda s: {x['id']: x['value'] for x in s['assets'] if x['kind']=='pick'}
                  assert picks(a) == picks(b), (old.name, a['date'])
          PY
          python3 script/frontend/build_shared_contracts.py --repo .
          python3 script/frontend/build_asset_value_data.py --repo .
          cd frontend
          npm ci
          npm run test:asset-value
          npm run build
      - name: Stage validated data on the change branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/data/asset_history/v10 frontend/public/data/asset_valuations/v10 frontend/public/data/asset_valuation.json processed/asset_history
          git commit -m 'Stage validated direct minutes history for all 30 teams'
          git push origin HEAD:codex/direct-future-minutes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-minutes-validation
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/direct-minutes/player_refresh.log
            ${{ runner.temp }}/direct-minutes/players/*.log
            frontend/public/data/asset_history/v10/refresh_status.json

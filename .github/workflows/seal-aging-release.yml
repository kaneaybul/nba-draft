name: Seal validated aging release
on:
  push:
    branches: [codex/aging-release-status]
    paths: [.github/workflows/seal-aging-release.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - name: Verify the rebuilt release and record its source identity
        run: |
          python3 script/asset_history/materialize.py --repo .
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'script/asset_history')
          from validate_attribution import validate
          from source_signature import source_signature
          from model_version import data_root,METHOD
          repo=Path.cwd();root=data_root(repo)
          report=json.loads((repo/'processed/asset_history/aging_validation.json').read_text())
          assert report['inventory_and_values']=='unchanged' and report['teams']==30
          checks=validate(repo)
          assert checks['selectable_periods']==report['selectable_periods']
          manifest=json.loads((root/'manifest.json').read_text())
          dates={t['latest'] for t in manifest['teams']};assert len(dates)==1
          day=dates.pop()
          status=dict(status='success',method=METHOD,observation_date=day,
                      recorded_at=datetime.now(timezone.utc).isoformat(),
                      teams=30,source_signature=source_signature(repo),
                      validation='Completed aging release; all prices unchanged and all 53100 date ranges reconciled')
          (root/'refresh_status.json').write_text(json.dumps(status,separators=(',',':'))+'\n')
          print(json.dumps(checks))
          PY
      - name: Commit validated refresh status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/public/data/asset_history/v9/refresh_status.json
          git commit -m "Mark completed aging release as validated"
          git push origin HEAD:codex/aging-release-status

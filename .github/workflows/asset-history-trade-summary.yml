name: Publish dated trade summaries
on:
  push:
    branches: [codex/trade-summary]
    paths:
      - script/asset_history/attribution*.py
      - script/asset_history/test_attribution_trades.py
      - frontend/src/AssetHistoryCharts.tsx
      - frontend/src/assetHistory.css
      - .github/workflows/asset-history-trade-summary.yml
permissions:
  contents: write
concurrency:
  group: dated-trade-summary-release
  cancel-in-progress: true
jobs:
  trades:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      VITE_PUBLIC_READ_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - run: python3 -m unittest discover -s script/asset_history -p 'test_attribution*.py'
      - run: python3 script/asset_history/materialize.py --repo .
      - name: Price each deal for all 30 teams
        run: python3 script/asset_history/attribution.py --repo . --work-dir "$RUNNER_TEMP/trade-summary" --trade-details-only
      - run: python3 script/asset_history/validate_attribution.py --repo .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node script/frontend/test_asset_history_visuals.mjs
      - run: npm run build
        working-directory: frontend
      - name: Save validated trade summaries
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0,"script/asset_history"); from model_version import DATA_VERSION; print(DATA_VERSION)')
          git add -f "frontend/public/data/asset_history/$version/attribution/"??.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish trade summaries for all 30 teams'
            git push origin HEAD:codex/trade-summary
          fi

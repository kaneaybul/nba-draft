name: Daily Refresh and Deploy

on:
  schedule:
    # 13:15 UTC daily (6:15 AM MT / 7:15 AM MDT)
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore pinned R and Python runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .work-runtime
          key: work-runtime-linux-v1-${{ hashFiles('script/frontend/work_r_packages.lock', 'script/asset_history/requirements.txt') }}

      - name: Prepare R and Python runtime
        run: bash script/frontend/setup_work_runtime.sh

      - name: Save pinned R and Python runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .work-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Install frontend dependencies
        run: |
          source .work-runtime/environment.sh
          npm ci --prefix frontend --no-audit --no-fund

      - name: Run full data refresh, validation, and frontend build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABALLR_API_KEY: ${{ secrets.DATABALLR_API_KEY }}
          DATABALLR_SIGNING_SECRET: ${{ secrets.DATABALLR_SIGNING_SECRET }}
        run: |
          source .work-runtime/environment.sh
          NBA_REFRESH_WORK_DIR="$RUNNER_TEMP/work-refresh" bash script/frontend/run_work_refresh.sh

      - name: Attach verified pinned v19/v20 asset history to dist
        run: |
          source .work-runtime/environment.sh
          python3 - <<'PY'
          import hashlib, pathlib, shutil, sys, tempfile
          sys.path.insert(0, 'script/frontend')
          import rehydrate_protected_static as rps
          policy = pathlib.Path('script/frontend/history_release_policy.json')
          sha = hashlib.sha256(policy.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory(prefix='pinned-history-') as tmp:
              out = pathlib.Path(tmp) / 'dist'
              rps.restore(out, policy, sha, 'frontend/public')
              ah_root = pathlib.Path('frontend/dist/data/asset_history')
              if ah_root.exists():
                  for child in list(ah_root.iterdir()):
                      if child.is_dir() and child.name not in ('v19', 'v20'):
                          shutil.rmtree(child)
              for gz in pathlib.Path('frontend/dist').rglob('*.json.gz'):
                  gz.unlink()
              for ver in ('v19', 'v20'):
                  src = out / 'data' / 'asset_history' / ver
                  dst = ah_root / ver
                  if dst.exists():
                      shutil.rmtree(dst)
                  shutil.copytree(src, dst)
              print('Attached verified v19/v20 pinned asset history to frontend/dist')
          PY

      - name: Deploy validated build to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Commit validated data updates back to main
        run: |
          set -euo pipefail
          # Re-compact materialized team JSONs before committing
          python3 script/asset_history/materialize.py --repo . --compact || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw/live processed/ frontend/public/data/
          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          git commit -m "Daily automated NBA refresh ${today} [skip ci]"
          git push origin HEAD:main

      - name: Write refresh summary
        if: always()
        run: |
          if [ -f raw/live/pending_reviews.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path('raw/live/pending_reviews.json').read_text())
          print(f"### Daily Refresh Status: `{d.get('status')}` ({d.get('checked_at')})")
          for item in d.get('pending', []):
              print(f"- **{item['stage']}**: `{item['error']}`")
          if not d.get('pending'):
              print("- All stages completed cleanly with zero pending reviews.")
          PY
          fi

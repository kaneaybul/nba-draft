name: Daily Refresh and Deploy

on:
  schedule:
    # Off-peak primary (13:23 UTC) + backup (14:07 UTC) so a dropped GitHub cron slot doesn't miss a day.
    - cron: "23 13 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if today's scheduled refresh already succeeded
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual trigger; running refresh."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(date -u +%F)"
          live_date="$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/frontend/public/data/live_status.json?t=$(date +%s)" 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("generated_at") or "")[:10])' 2>/dev/null || true)"
          if [ "$live_date" = "$today" ]; then
            echo "Today's refresh ($today) already completed; skipping backup schedule slot."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Latest live_status date is '${live_date:-unknown}' (today is $today); running refresh."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh-and-deploy:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore pinned R and Python runtime cache
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: .work-runtime
          key: work-runtime-linux-v2-py312-${{ hashFiles('script/frontend/work_r_packages.lock', 'script/asset_history/requirements.txt') }}

      - name: Prepare R and Python runtime
        run: bash script/frontend/setup_work_runtime.sh

      - name: Save pinned R and Python runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .work-runtime
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Install frontend dependencies
        run: |
          source .work-runtime/environment.sh
          npm ci --prefix frontend --no-audit --no-fund

      - name: Hydrate verified pinned v19/v20 asset history into frontend/public
        run: |
          source .work-runtime/environment.sh
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, 'script/frontend')
          import rehydrate_protected_static as rps
          policy = json.loads(pathlib.Path('script/frontend/history_release_policy.json').read_text())
          origin = policy['restore_origin'].rstrip('/')
          public = pathlib.Path('frontend/public')
          count = 0
          for name, digest in sorted(policy['protected_files'].items()):
              if not name.startswith(('data/asset_history/v19/', 'data/asset_history/v20/')):
                  continue
              dest = public / name
              if dest.is_file() and hashlib.sha256(dest.read_bytes()).hexdigest() == digest:
                  count += 1
                  continue
              data = rps.download(f'{origin}/{name}')
              if hashlib.sha256(data).hexdigest() != digest:
                  raise ValueError(f'Pinned SHA-256 mismatch: {name}')
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              count += 1
          print(f'Hydrated {count} verified v19/v20 pinned asset history files into frontend/public')
          PY

      - name: Run full data refresh, validation, and frontend build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABALLR_API_KEY: ${{ secrets.DATABALLR_API_KEY }}
          DATABALLR_SIGNING_SECRET: ${{ secrets.DATABALLR_SIGNING_SECRET }}
        run: |
          source .work-runtime/environment.sh
          NBA_REFRESH_WORK_DIR="$RUNNER_TEMP/work-refresh" bash script/frontend/run_work_refresh.sh

      - name: Prune unused legacy asset history from dist before Pages deploy
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          dist = pathlib.Path('frontend/dist')
          ah_root = dist / 'data' / 'asset_history'
          if ah_root.exists():
              for child in list(ah_root.iterdir()):
                  if child.is_dir() and child.name not in ('v19', 'v20'):
                      shutil.rmtree(child)
          for gz in dist.rglob('*.json.gz'):
              gz.unlink()
          print('Pruned unused legacy asset history and .json.gz files from frontend/dist')
          PY

      - name: Deploy validated build to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Commit validated data updates back to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw/live processed/ frontend/public/data/
          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          git commit -m "Daily automated NBA refresh ${today} [skip ci]"
          git push origin HEAD:main

      - name: Write refresh summary
        if: always()
        run: |
          if [ -f raw/live/pending_reviews.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path('raw/live/pending_reviews.json').read_text())
          print(f"### Daily Refresh Status: `{d.get('status')}` ({d.get('checked_at')})")
          for item in d.get('pending', []):
              print(f"- **{item['stage']}**: `{item['error']}`")
          if not d.get('pending'):
              print("- All stages completed cleanly with zero pending reviews.")
          PY
          fi

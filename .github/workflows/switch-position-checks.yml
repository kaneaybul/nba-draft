name: Verify daily positions and SWITCH

on:
  pull_request:
    paths:
      - script/data/*positions*
      - script/data/*switch*
      - script/data/*transport*
      - script/frontend/player_pool.R
      - script/frontend/*positions.R
      - script/frontend/refresh_live_switch.R
      - .github/workflows/switch-position-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
      - name: Install position-check dependencies
        shell: Rscript {0}
        run: |
          rspm <- Sys.getenv('RSPM','')
          install.packages(c('jsonlite','rvest','xml2'),repos=if(nzchar(rspm)) rspm else 'https://cloud.r-project.org')
      - name: Test position and request behavior
        run: |
          python3 -m unittest discover -s script/data -p 'test_live_positions.py'
          python3 -m unittest discover -s script/data -p 'test_nba_transport.py'
          python3 -m unittest discover -s script/data -p 'test_live_switch.py'
          python3 -m unittest discover -s script/data -p 'test_live_skill_stats.py'
          Rscript script/frontend/test_live_positions.R
          Rscript script/frontend/test_live_switch.R
      - name: Check public sources without credentials or deployment
        run: |
          BREF_POSITION_YEARS=2027 BREF_POSITION_REFRESH=true Rscript script/data/pull_bref_position_estimates.R
          python3 -u script/data/diagnose_switch_refresh.py
          Rscript script/frontend/refresh_live_switch.R
          python3 -c "import json; f=json.load(open('raw/live/skill_stats.json')); print('SWITCH FINAL AUDIT',json.dumps(f['switch_status'])); print('PETERSON',json.dumps(next(p for p in f['players'] if p['player_name']=='Darryn Peterson')))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: position-switch-diagnostics
          path: |
            raw/live/position_status.json
            raw/live/positions.json
            raw/live/switch_diagnostics.json

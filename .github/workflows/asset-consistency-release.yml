name: Validate consistent asset history release
on:
  push:
    branches: [codex/consistent-asset-window]
    paths:
      - script/asset_history/**
      - script/frontend/**
      - frontend/src/**
      - .github/workflows/asset-consistency-release.yml
permissions:
  contents: write
concurrency:
  group: consistent-asset-window-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      VITE_PUBLIC_READ_ONLY: 'true'
      FRONTEND_MAX_STATIC_ASSET_BYTES: '26214400'
      FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - name: Verify minutes, rolling values and historical loading rules
        run: |
          python3 -m unittest discover -s script/asset_history -p 'test_*.py'
          python3 -m unittest discover -s script/asset_history/backfill -p 'test_*.py'
          python3 script/frontend/test_asset_value_data.py
      - name: Materialize the saved source observations
        run: |
          python3 script/asset_history/materialize.py --repo .
          python3 - <<'PY'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'script/asset_history/backfill')
          from run_player_refresh import unpack
          unpack(Path('processed/asset_history/canonical_runtime_seed.zip'),Path(os.environ['RUNNER_TEMP'])/'consistent-assets/runtime')
          PY
      - uses: actions/cache/restore@v4
        id: annual_checkpoint
        with:
          path: ${{ runner.temp }}/consistent-assets/annual_projection_checkpoint
          key: consistent-asset-projections-v8-${{ github.sha }}
          restore-keys: consistent-asset-projections-v8-
      - name: Recompute every player and pick in the Asset History window
        run: python3 script/asset_history/endpoint_stock_release.py --repo . --runtime "$RUNNER_TEMP/consistent-assets/runtime"
      - uses: actions/cache/save@v4
        if: always() && steps.annual_checkpoint.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/consistent-assets/annual_projection_checkpoint
          key: consistent-asset-projections-v8-${{ github.sha }}
      - name: Validate all dates, teams and minutes provenance
        run: |
          python3 script/asset_history/calibration/review_release.py --repo .
          python3 script/frontend/build_asset_value_data.py --repo .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
      - name: Verify and republish Impact minutes from the existing source inputs
        run: |
          Rscript -e 'rspm <- Sys.getenv("RSPM", ""); repos <- if(nzchar(rspm)) rspm else "https://cloud.r-project.org"; packages <- c("jsonlite","rvest","mgcv"); missing <- packages[!vapply(packages,requireNamespace,logical(1),quietly=TRUE)]; if(length(missing)) install.packages(missing,repos=repos); stopifnot(all(vapply(packages,requireNamespace,logical(1),quietly=TRUE)))'
          Rscript script/frontend/test_live_minutes.R
          Rscript script/frontend/export_frontend_data.R
          python3 script/frontend/build_asset_value_data.py --repo .
      - name: Verify every frontend value surface
        working-directory: frontend
        run: |
          node ../script/frontend/test_data_refresh.mjs
          node ../script/frontend/test_asset_surface_consistency.mjs
          npm run test:asset-value
          npm run test:trade-machine
          npm run test:trade-suggestions
          npm run validate:data
          ASSET_HISTORY_FRONTEND=. node ../script/frontend/test_asset_history_visuals.mjs
          npm run build
      - name: Commit the fully validated data to the release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/data processed/asset_history
          if ! git diff --cached --quiet; then
            git commit -m 'Publish consistent minutes and valuations across the asset history window'
            git push origin HEAD:codex/consistent-asset-window
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-consistency-validation
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/consistent-assets/player_refresh.log
            ${{ runner.temp }}/consistent-assets/players/*.log
            ${{ runner.temp }}/consistent-assets/players/path_pricing_coverage.json
            ${{ runner.temp }}/consistent-assets/players/player_candidates.json
            ${{ runner.temp }}/consistent-assets/players/*/monthly_annual_values.csv
            ${{ runner.temp }}/consistent-assets/players/*/monthly_player_values.csv
            ${{ runner.temp }}/consistent-assets/players/*/league_player_coverage.json
            ${{ runner.temp }}/consistent-assets/players/player_state_staged
            processed/asset_history/methodology_review.json
            processed/asset_history/attribution_validation.json
            frontend/public/data/asset_history/v8/refresh_status.json

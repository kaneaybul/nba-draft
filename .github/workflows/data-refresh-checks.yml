name: Verify frontend data refresh

on:
  pull_request:
    paths:
      - frontend/src/data.ts
      - frontend/src/assetValue.ts
      - frontend/package*.json
      - script/frontend/test_data_refresh.mjs
      - .github/workflows/data-refresh-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify projection and valuation updates reach the app
        run: node script/frontend/test_data_refresh.mjs

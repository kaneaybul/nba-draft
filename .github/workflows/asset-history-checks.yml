name: Check asset history
on:
  pull_request:
    paths:
      - frontend/src/AssetHistory.tsx
      - frontend/src/assetHistory.css
      - frontend/src/App.tsx
      - frontend/public/data/asset_history/**
      - script/asset_history/**
      - .github/workflows/asset-history-checks.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 -m unittest discover -s script/asset_history -p 'test_*.py'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

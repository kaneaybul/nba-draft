name: Check asset history
on:
  pull_request:
    paths:
      - frontend/src/AssetHistory.tsx
      - frontend/src/AssetHistoryCharts.tsx
      - script/frontend/test_asset_history_visuals.mjs
      - frontend/src/assetHistory.css
      - frontend/src/App.tsx
      - frontend/public/data/asset_history/**
      - script/asset_history/**
      - .github/workflows/asset-history-checks.yml
      - .github/workflows/asset-history-refresh.yml
      - processed/asset_history/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - run: python3 script/asset_history/materialize.py --repo .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 -m unittest discover -s script/asset_history -p 'test_*.py'
      - run: python3 -m unittest discover -s script/asset_history/backfill -p 'test_*.py'
      - run: npm ci
        working-directory: frontend
      - run: node script/frontend/test_asset_history_visuals.mjs
      - run: npm run build
        working-directory: frontend

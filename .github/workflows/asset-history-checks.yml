name: Check asset history
on:
  pull_request:
    paths:
      - script/asset_history/**
      - .github/workflows/asset-history-checks.yml
      - .github/workflows/asset-history-refresh.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - run: python3 script/asset_history/materialize.py --repo .
      - run: python3 -m unittest discover -s script/asset_history -p 'test_*.py'
      - run: python3 -m unittest discover -s script/asset_history/backfill -p 'test_*.py'
      - name: Rehearse all portfolios in this disposable checkout
        run: python3 script/asset_history/refresh.py --repo . --work-dir "$RUNNER_TEMP/asset-history-rehearsal"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PUBLIC_READ_ONLY: "true"
          FRONTEND_MAX_STATIC_ASSET_BYTES: "26214400"
          FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: "8388608"
      - name: Collect rehearsal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-history-rehearsal
          path: |
            ${{ runner.temp }}/asset-history-rehearsal/player_refresh.log
            ${{ runner.temp }}/asset-history-rehearsal/players/*.log
            ${{ runner.temp }}/asset-history-rehearsal/runtime/monthly_reconstruction/league_ownership/roster_refresh_source.json
            processed/asset_history/contracts/refresh_audit.json
            frontend/public/data/asset_history/v2/refresh_status.json
          if-no-files-found: ignore
          retention-days: 3

name: Deploy static app

# Automatic runs are replaced by the scheduled Work refresh.
on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Skipped jobs must not cancel a valid deployment after an upstream failure.
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_PUBLIC_READ_ONLY: "true"
      FRONTEND_MAX_STATIC_ASSET_BYTES: "26214400"
      FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: "8388608"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate frontend data contract
        run: |
          if [ -f ../script/asset_history/materialize.py ]; then
            python3 ../script/asset_history/materialize.py --repo ..
          fi
          python3 ../script/frontend/test_asset_value_data.py
          python3 ../script/frontend/build_asset_value_data.py --repo ..
          node ../script/frontend/build_cap_tracker_spotrac_data.mjs
          node ../script/frontend/build_static_data_manifest.mjs
          node -e 'const d=require("./public/data/cap_tracker.json"); console.log("Cap tracker regenerated; cached teams:",d.cap_fallbacks.length)'
          npm run validate:data
        working-directory: frontend

      - name: Build frontend
        run: |
          node ../script/frontend/test_data_refresh.mjs
          npm run test:asset-value
          node ../script/frontend/test_asset_surface_consistency.mjs
          node ../script/frontend/test_shared_contracts.mjs --require-export
          npm run test:cap-tracker
          npm run test:trade-machine
          npm run test:trade-suggestions
          npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}


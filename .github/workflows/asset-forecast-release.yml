name: Rebuild forecast-based asset attribution

on:
  push:
    branches: [codex/asset-history-forecast-baseline]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - name: Check attribution and publication rules
        run: python3 -m unittest discover -s script/asset_history -p 'test_*.py'
      - name: Rebuild the ledger from the published observations
        run: |
          python3 script/asset_history/materialize.py --repo .
          ledger_dir=$(PYTHONPATH=script/asset_history python3 -c 'from pathlib import Path; from model_version import data_root; print(data_root(Path(".")) / "attribution")')
          echo "LEDGER_DIR=$ledger_dir" >> "$GITHUB_ENV"
          cp -r "$ledger_dir" "$RUNNER_TEMP/previous-ledger"
          python3 script/asset_history/attribution.py --repo . --work-dir "$RUNNER_TEMP/forecast-attribution" --workers 3
          python3 script/asset_history/validate_attribution.py --repo .
      - name: Verify the two categories are the only changes
        env:
          PREVIOUS_LEDGER: ${{ runner.temp }}/previous-ledger
        run: |
          PYTHONPATH=script/asset_history python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          from attribution import LABELS, NAMES

          old_dir = Path(os.environ['PREVIOUS_LEDGER'])
          new_dir = Path(os.environ['LEDGER_DIR'])
          unchanged = set(LABELS) - {'aging', 'player'}
          for team in NAMES:
              old = json.loads((old_dir / f'{team}.json').read_text())
              new = json.loads((new_dir / f'{team}.json').read_text())
              assert old['source_signature'] == new['source_signature'], team
              for a, b in zip(old['intervals'], new['intervals'], strict=True):
                  assert all(a[k] == b[k] for k in ('start', 'end', 'opening', 'closing')), team
                  expected = a['categories']['aging'] + a['components']['player'].get('Change beyond expected aging', 0.)
                  assert math.isclose(expected, b['categories']['aging'], abs_tol=.01, rel_tol=0.), (team, a['end'], expected)
                  for k in unchanged:
                      for field in ('categories', 'components', 'contributors'):
                          before, after = a[field][k], b[field][k]
                          if field == 'contributors':
                              before = {p['player']: p['value'] for p in before}
                              after = {p['player']: p['value'] for p in after}
                          if field == 'categories':
                              before, after = {k: before}, {k: after}
                          for label in before.keys() | after.keys():
                              assert math.isclose(before.get(label, 0.), after.get(label, 0.), abs_tol=.01, rel_tol=0.), (team, a['end'], k, field, label)
          print('All teams retained their asset marks and other attribution categories.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify waterfall and league rankings against the rebuilt ledgers
        run: node script/frontend/test_asset_history_visuals.mjs
      - name: Save validated attribution to the change branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$LEDGER_DIR" processed/asset_history/attribution_validation.json
          git commit -m 'Publish forecast-based player attribution for all 30 teams'
          git push origin "HEAD:$GITHUB_REF"

name: Build MECE asset attribution
# Automatic runs are replaced by the scheduled Work refresh.
on:
  workflow_dispatch:

concurrency:
  group: mece-waterfall-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  attribution:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      VITE_PUBLIC_READ_ONLY: 'true'
      FRONTEND_MAX_STATIC_ASSET_BYTES: '26214400'
      FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: '8388608'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - run: python3 script/asset_history/materialize.py --repo .
      - run: python3 -m unittest discover -s script/asset_history -p 'test_attribution.py'
      - name: Generate the shared 30-team MECE attribution
        run: python3 script/asset_history/attribution.py --repo . --work-dir "$RUNNER_TEMP/mece-attribution" --workers 2
      - name: Validate every team, period, category and league transfer
        run: python3 script/asset_history/validate_attribution.py --repo .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node script/frontend/test_asset_history_visuals.mjs
      - run: npm run build
        working-directory: frontend
      - name: Preserve validated NBA app data for the reviewed release
        uses: actions/upload-artifact@v4
        with:
          name: mece-attribution-release
          path: |
            frontend/public/data/asset_history/v7/attribution
            processed/asset_history/attribution_cache
            processed/asset_history/attribution_validation.json
          retention-days: 7

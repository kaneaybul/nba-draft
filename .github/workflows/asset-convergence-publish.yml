name: Publish validated shared draftee data
on:
  push:
    branches: [codex/shared-draft-value]
    paths: [.github/workflows/asset-convergence-publish.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: shared-draft-data-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_PUBLIC_READ_ONLY: 'true'
      FRONTEND_MAX_STATIC_ASSET_BYTES: '26214400'
      FRONTEND_MAX_INITIAL_PAYLOAD_BYTES: '8388608'
      RELEASE_RUN: '41942166840'
      RELEASE_SHA: '22dda78ceac6b22ed1daf848efb05cb9684bf241'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify successful same-repository release and unchanged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/kaneaybul/nba-draft/actions/runs/"$RELEASE_RUN" > "$RUNNER_TEMP/release-run.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'release-run.json').read_text())
          assert r['conclusion']=='success'
          assert r['head_sha']==os.environ['RELEASE_SHA']
          assert r['head_repository']['full_name']=='kaneaybul/nba-draft'
          assert r['head_branch']=='codex/shared-draft-value'
          PY
          git diff --exit-code "$RELEASE_SHA" HEAD -- . ':!.github/workflows/asset-convergence-publish.yml'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13377346470'
          run-id: '41942166840'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-release
          merge-multiple: true
      - name: Restore only generated data from the validated artifact
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'validated-release'
          prefixes=('frontend/public/data/asset_history/v9/','frontend/public/data/asset_valuations/v9/','processed/asset_history/player_state/')
          exact={'frontend/public/data/asset_valuation.json','processed/asset_history/picks/trained_pick_model.json','processed/asset_history/methodology_review.json','processed/asset_history/attribution_validation.json'}
          copied=0
          for source in root.rglob('*'):
              if not source.is_file():continue
              rel=source.relative_to(root).as_posix()
              if rel in exact or rel.startswith(prefixes):
                  assert not source.is_symlink()
                  assert rel.endswith(('.json','.json.gz'))
                  target=Path(rel);target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(source,target);copied+=1
          assert copied>60,('Incomplete release artifact',copied)
          assert len(list(Path('frontend/public/data/asset_history/v9/teams').glob('*.json.gz')))==30
          print('Restored generated data files:',copied)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: script/asset_history/requirements.txt
      - run: python3 -m pip install -r script/asset_history/requirements.txt
      - name: Verify complete data and shared valuation method
        run: |
          python3 script/asset_history/materialize.py --repo .
          python3 script/asset_history/calibration/review_release.py --repo .
          python3 script/frontend/build_asset_value_data.py --repo .
          python3 script/asset_history/materialize.py --repo . --compact
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify app integration and build
        working-directory: frontend
        run: |
          npm run test:asset-value
          npm run test:trade-machine
          npm run test:trade-suggestions
          node ../script/frontend/test_asset_surface_consistency.mjs
          ASSET_HISTORY_FRONTEND=. node ../script/frontend/test_asset_history_visuals.mjs
          npm run shard:data
          npm run validate:data
          npm run build
      - name: Commit verified data to the existing review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/asset_history/v9/attribution frontend/public/data/asset_history/v9/manifest.json frontend/public/data/asset_history/v9/refresh_status.json
          git add frontend/public/data/asset_history/v9/teams/*.json.gz
          git add frontend/public/data/asset_valuations/v9 frontend/public/data/asset_valuation.json
          git add processed/asset_history/player_state processed/asset_history/picks/trained_pick_model.json processed/asset_history/methodology_review.json processed/asset_history/attribution_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin codex/shared-draft-value
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git commit -m "Publish verified shared draftee dataset from successful repository build"
          git push origin HEAD:refs/heads/codex/shared-draft-value
